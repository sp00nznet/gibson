<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' gibson-music:">
<title>GIBSON</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world"></canvas>
  <div id="frame">
    <div id="banner"><canvas id="logo"></canvas><div id="status"></div></div>
    <div id="nyx"><span class="tag">NYX&gt;</span> <span id="nyxtext"></span></div>
    <div id="tabs" class="solo"><button id="newtab" title="new tab (ctrl+shift+T)">+</button></div>
    <div id="termwrap"></div>
    <canvas id="scroller"></canvas>
  </div>
  <div id="player" class="off">
    <button data-a="music:prev" title="previous (ctrl+shift+[)">|&lt;&lt;</button><button data-a="music:toggle" id="pp" title="play/pause (ctrl+shift+P)">&gt;||</button><button data-a="music:next" title="next (ctrl+shift+])">&gt;&gt;|</button>
    <button data-a="music:shuffle" id="shuf" title="shuffle">SHUF</button><button data-a="music:voldown" title="volume (ctrl+shift+-)">-</button><button data-a="music:volup" title="volume (ctrl+shift+=)">+</button><button data-a="music:pick" title="choose folder">DIR</button>
    <div id="track"></div>
  </div>
  <canvas id="rain"></canvas>
  <canvas id="smoke"></canvas>
  <div id="crt"></div>
  <div id="boot"><pre id="bootlog"></pre></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="activity.js"></script>
  <script src="audio.js"></script>
  <script src="worlds.js"></script>
  <script src="worlds/pipes.js"></script>
  <script src="worlds/maze.js"></script>
  <script src="worlds/cycles.js"></script>
  <script src="worlds/battlezone.js"></script>
  <script src="worlds/street.js"></script>
  <script src="worlds/net.js"></script>
  <script src="worlds/hive.js"></script>
  <script src="worlds/news.js"></script>
  <script src="fx.js"></script>
  <script src="jukebox.js"></script>
  <script src="nyx.js"></script>
  <script src="app.js"></script>
</body>
</html>
