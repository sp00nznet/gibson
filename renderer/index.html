<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' gibson-music:; connect-src 'self' gibson-music:">
<title>GIBSON</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="player.css">
<link rel="stylesheet" href="theatre.css">
<link rel="stylesheet" href="irc.css">
</head>
<body>
  <canvas id="world"></canvas>
  <div id="frame">
    <div id="banner"><canvas id="logo"></canvas><div id="status"></div></div>
    <div id="nyx"><span class="tag">NYX&gt;</span> <span id="nyxtext"></span></div>
    <div id="tabs" class="solo"><button id="newtab" title="new tab (ctrl+shift+T)">+</button><button id="shells" title="new tab with another shell">&#9662;</button></div>
    <div id="mid"><div id="termwrap"></div><div id="irc"></div></div>
    <canvas id="scroller"></canvas>
  </div>
  <div id="player" class="off">
    <div class="bar">GIBSON AMP</div>
    <div class="body">
      <div class="scr"><div class="lcd">0:00</div><canvas width="84" height="22"></canvas></div>
      <div class="marq"><div id="track"></div></div>
      <div class="info"></div>
    </div>
    <div class="btns">
      <button data-a="music:prev" title="previous (ctrl+shift+[)">|&lt;</button><button data-a="music:toggle" id="pp" title="play/pause (ctrl+shift+P)">&gt;</button><button data-a="music:next" title="next (ctrl+shift+])">&gt;|</button><button data-a="music:shuffle" id="shuf" title="shuffle">SHUF</button><button data-a="music:voldown" title="volume (ctrl+shift+-)">-</button><button data-a="music:volup" title="volume (ctrl+shift+=)">+</button><button data-a="music:pick" title="choose folder">DIR</button>
    </div>
  </div>
  <div id="sysmon" class="off">
    <div class="bar">GIBSON SYSMON</div>
    <canvas id="sm-graph" width="268" height="44"></canvas>
    <div id="sm-rows"></div>
    <div id="sm-procs"></div>
  </div>
  <div id="synth" class="off">
    <div class="bar">GIBSON SYNTH</div>
    <div class="now" id="sy-now"></div>
    <div class="knobs">
      <label>CUTOFF<input type="range" data-fx="cut" min="0" max="1" step="0.01" value="1"></label>
      <label>RESO<input type="range" data-fx="res" min="0" max="1" step="0.01" value="0"></label>
      <label>LO CUT<input type="range" data-fx="low" min="0" max="1" step="0.01" value="0"></label>
      <label>DRIVE<input type="range" data-fx="drive" min="0" max="1" step="0.01" value="0"></label>
      <label>ECHO<input type="range" data-fx="echo" min="0" max="1" step="0.01" value="0"></label>
      <label class="juke">SPEED<input type="range" id="sy-rate" min="0.5" max="1.5" step="0.01" value="1"></label>
    </div>
    <div class="syn">
      <div class="row" id="sy-styles"></div>
      <div class="row" id="sy-layers"></div>
      <div class="row"><button id="sy-down">KEY -</button><button id="sy-up">KEY +</button><button id="sy-next">NEXT SONG</button><button id="sy-reset">RESET</button></div>
    </div>
  </div>
  <canvas id="rain"></canvas>
  <canvas id="smoke"></canvas>
  <div id="crt"></div>
  <div id="boot"><pre id="bootlog"></pre><pre id="biologo">   .   *   .      ENERGY
 *   \ | /   *     ALLY
--- -( @ )- ---
 *   / | \   *   (C) GIBSON
   '   *   '       SYSTEMS</pre></div>
