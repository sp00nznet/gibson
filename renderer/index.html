<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' gibson-music:; connect-src 'self' gibson-music:">
<title>GIBSON</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="player.css">
<link rel="stylesheet" href="theatre.css">
<link rel="stylesheet" href="irc.css">
</head>
<body>
  <canvas id="world"></canvas>
  <div id="frame">
    <div id="banner"><canvas id="logo"></canvas><div id="status"></div></div>
    <div id="nyx"><span class="tag">NYX&gt;</span> <span id="nyxtext"></span></div>
    <div id="tabs" class="solo"><button id="newtab" title="new tab (ctrl+shift+T)">+</button><button id="shells" title="new tab with another shell">&#9662;</button></div>
    <div id="mid"><div id="termwrap"></div><div id="irc"></div></div>
    <canvas id="scroller"></canvas>
  </div>
  <div id="player" class="off">
    <div class="bar">GIBSON AMP</div>
    <div class="body">
      <div class="scr"><div class="lcd">0:00</div><canvas width="84" height="22"></canvas></div>
      <div class="marq"><div id="track"></div></div>
      <div class="info"></div>
    </div>
    <div class="btns">
      <button data-a="music:prev" title="previous (ctrl+shift+[)">|&lt;</button><button data-a="music:toggle" id="pp" title="play/pause (ctrl+shift+P)">&gt;</button><button data-a="music:next" title="next (ctrl+shift+])">&gt;|</button><button data-a="music:shuffle" id="shuf" title="shuffle">SHUF</button><button data-a="music:voldown" title="volume (ctrl+shift+-)">-</button><button data-a="music:volup" title="volume (ctrl+shift+=)">+</button><button data-a="music:pick" title="choose folder">DIR</button>
    </div>
  </div>
  <canvas id="rain"></canvas>
  <canvas id="smoke"></canvas>
  <div id="crt"></div>
  <div id="boot"><pre id="bootlog"></pre></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="activity.js"></script>
  <script src="audio.js"></script>
  <script src="worlds.js"></script>
  <script src="worlds/pipes.js"></script>
  <script src="worlds/maze.js"></script>
  <script src="worlds/cycles.js"></script>
  <script src="worlds/battlezone.js"></script>
  <script src="worlds/street.js"></script>
  <script src="worlds/net.js"></script>
  <script src="worlds/hive.js"></script>
  <script src="worlds/news.js"></script>
  <script src="worlds/toasters.js"></script>
  <script src="worlds/earth.js"></script>
  <script src="worlds/keygen.js"></script>
  <script src="worlds/garbage.js"></script>
  <script src="worlds/towers.js"></script>
  <script src="worlds/milkdrop.js"></script>
  <script src="worlds/ruins.js"></script>
  <script src="worlds/cyberpunk.js"></script>
  <script src="worlds/skyline.js"></script>
  <script src="worlds/mystify.js"></script>
  <script src="worlds/fringe.js"></script>
  <script src="worlds/attractor.js"></script>
  <script src="worlds/helix.js"></script>
  <script src="worlds/flowerbox.js"></script>
  <script src="worlds/nocturne.js"></script>
  <script src="worlds/life.js"></script>
  <script src="worlds/deathmatch.js"></script>
  <script src="worlds/zeroset.js"></script>
  <script src="fx.js"></script>
  <script src="jukebox.js"></script>
  <script src="nyx.js"></script>
  <script src="theatre.js"></script>
  <script src="irc.js"></script>
  <script src="app.js"></script>
</body>
</html>
